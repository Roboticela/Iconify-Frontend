<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>Iconify Support – New Message</title>
  <!--[if mso]>
  <noscript>
    <xml>
      <o:OfficeDocumentSettings>
        <o:PixelsPerInch>96</o:PixelsPerInch>
      </o:OfficeDocumentSettings>
    </xml>
  </noscript>
  <![endif]-->
  <style>
    /* Reset and base – keep minimal; rely on inline for critical */
    body, table, td, p, a { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
    table, td { mso-table-lspace: 0pt; mso-table-rspace: 0pt; }
    img { border: 0; height: auto; line-height: 100%; outline: none; text-decoration: none; }
    body { margin: 0 !important; padding: 0 !important; width: 100% !important; }
  </style>
</head>
<body style="margin: 0; padding: 0; background-color: #f1f5f9; font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, Roboto, sans-serif;">
  <!-- Wrapper -->
  <table role="presentation" cellpadding="0" cellspacing="0" width="100%" style="background-color: #f1f5f9;">
    <tr>
      <td align="center" style="padding: 40px 20px;">
        <!-- Container (max 600px) -->
        <table role="presentation" cellpadding="0" cellspacing="0" width="600" style="max-width: 600px; width: 100%; margin: 0 auto;">
          <!-- Header -->
          <tr>
            <td style="padding: 32px 40px 24px; background-color: #0f172a; border-radius: 16px 16px 0 0; text-align: center;">
              <table role="presentation" cellpadding="0" cellspacing="0" width="100%">
                <tr>
                  <td align="center">
                    <div style="display: inline-block; width: 48px; height: 48px; background-color: rgba(255,255,255,0.12); border-radius: 12px; line-height: 48px; text-align: center; font-size: 24px;">✨</div>
                    <h1 style="margin: 16px 0 0; font-size: 24px; font-weight: 700; color: #f8fafc; letter-spacing: -0.02em;">Iconify</h1>
                    <p style="margin: 8px 0 0; font-size: 14px; color: #94a3b8;">New support message</p>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <!-- Card body -->
          <tr>
            <td style="padding: 0; background-color: #ffffff; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.08), 0 2px 4px -2px rgba(0,0,0,0.06);">
              <table role="presentation" cellpadding="0" cellspacing="0" width="100%" style="border-collapse: separate; border-spacing: 0;">
                <!-- From -->
                <tr>
                  <td style="padding: 28px 40px 16px; border-bottom: 1px solid #e2e8f0;">
                    <p style="margin: 0; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: #64748b;">From</p>
                    <p style="margin: 6px 0 0; font-size: 17px; font-weight: 600; color: #0f172a;">{{fullName}}</p>
                  </td>
                </tr>
                <!-- Email -->
                <tr>
                  <td style="padding: 20px 40px; border-bottom: 1px solid #e2e8f0;">
                    <p style="margin: 0; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: #64748b;">Email</p>
                    <p style="margin: 6px 0 0; font-size: 16px; color: #0f172a;">
                      <a href="mailto:{{email}}" style="color: #2563eb; text-decoration: none;">{{email}}</a>
                    </p>
                  </td>
                </tr>
                <!-- Message -->
                <tr>
                  <td style="padding: 24px 40px 32px;">
                    <p style="margin: 0; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: #64748b;">Message</p>
                    <div style="margin: 12px 0 0; padding: 20px; background-color: #f8fafc; border-radius: 12px; border-left: 4px solid #2563eb;">
                      <p style="margin: 0; font-size: 15px; line-height: 1.6; color: #334155; white-space: pre-wrap;">{{message}}</p>
                    </div>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <!-- Footer -->
          <tr>
            <td style="padding: 24px 40px; background-color: #f8fafc; border-radius: 0 0 16px 16px; border-top: 1px solid #e2e8f0; text-align: center;">
              <p style="margin: 0; font-size: 13px; color: #64748b;">
                Sent via <strong style="color: #0f172a;">Iconify</strong> Support · <a href="https://github.com/Roboticela" style="color: #2563eb; text-decoration: none;">Roboticela</a>
              </p>
              <p style="margin: 12px 0 0; font-size: 12px; color: #94a3b8;">© Roboticela · Proprietary · All rights reserved</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
